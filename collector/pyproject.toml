[project]
name = "wbot-collector"
version = "0.1.0"
description = "Archives GTFS and GTFS-Realtime feeds for Was the Bus On Time?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "gtfs-realtime-bindings>=1.0",
    "httpx>=0.27",
    "zstandard>=0.23",
]

[project.scripts]
wbot-collector = "wbot_collector.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
