[project]
name = "wbot-pipeline"
version = "0.1.0"
description = "Computes on-time statistics from the archived feeds for Was the Bus On Time?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "gtfs-realtime-bindings>=1.0",
    "pyarrow>=17",
    "tzdata>=2024.1",
    # For wbot_site.contract (the site files format, standard library only).
    "wbot-site",
    "zstandard>=0.23",
]

[project.scripts]
wbot-pipeline = "wbot_pipeline.__main__:main"

[dependency-groups]
# The tests also check the output with the site's own loader and build (wbot-site, above).
dev = ["pytest>=8"]

[tool.uv.sources]
wbot-site = { path = "../site", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
